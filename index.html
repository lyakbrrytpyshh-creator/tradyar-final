    '<div class="pay-terms"><label><input type="checkbox" id="mpAgree" style="width:18px;height:18px;accent-color:var(--green);cursor:pointer;flex:none;margin-top:3px"><span>تأیید می‌کنم که مبلغ رو واریز کردم و اطلاعات بالا صحیح هست.</span></label></div>'+

    '<div class="m-actions"><button type="button" class="btn btn-gold btn-block" id="mpSubmit">'+icon('send')+'ثبت و ارسال برای مدیر</button></div>',
    {wide:true}
  );

  // کپی شماره کارت
  const copyBtn=$('#copyCardBtn');
  if(copyBtn){
    copyBtn.addEventListener('click',function(){
      copyText(card,'شماره کارت کپی شد');
    });
  }

  // تاریخ شمسی
  const dateWrap=$('#mpDate');
  if(dateWrap&&dateWrap.parentElement){
    dateWrap.parentElement.addEventListener('click',function(e){
      if(e.target.closest('.jdate-ic')||e.target===dateWrap){
        openJalaliPicker(dateWrap.parentElement,dateWrap.value||fmtJalStr.apply(null,todayJal()),function(val){
          dateWrap.value=val;
        });
      }
    });
  }

  // آپلود عکس رسید
  const drop=$('#mpDrop');
  const fileInput=$('#mpFile');
  const preview=$('#mpPreview');
  let receiptKey=null;

  if(drop&&fileInput){
    drop.addEventListener('click',function(){fileInput.click()});
    drop.addEventListener('dragover',function(e){e.preventDefault();drop.style.borderColor='var(--green)'});
    drop.addEventListener('dragleave',function(){drop.style.borderColor='var(--line-2)'});
    drop.addEventListener('drop',function(e){
      e.preventDefault();
      drop.style.borderColor='var(--line-2)';
      handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change',function(e){handleFiles(e.target.files)});

    function handleFiles(files){
      if(!files||!files.length)return;
      const f=files[0];
      if(!/^image\//.test(f.type)){toast('فقط تصویر مجاز است','err');return}
      if(f.size>5*1048576){toast('حجم بیش از ۵ مگابایت','err');return}

      compressImage(f,1200,.78).then(function(dataUrl){
        const key=uid();
        return Blobs.put('receipt_'+key,dataUrl).then(function(){return key});
      }).then(function(key){
        receiptKey=key;
        preview.innerHTML='<div class="dip"><img src="'+URL.createObjectURL(f)+'" alt="رسید"><button type="button" class="dip-x" id="mpReceiptX">×</button></div>';
        const xBtn=$('#mpReceiptX');
        if(xBtn)xBtn.addEventListener('click',function(){
          receiptKey=null;
          preview.innerHTML='';
          fileInput.value='';
        });
        toast('رسید آپلود شد');
      }).catch(function(e){
        logSilentError('receipt_upload',e);
        toast('خطا در آپلود','err');
      });
    }
  }

  // ثبت و ارسال
  const submitBtn=$('#mpSubmit');
  if(submitBtn){
    submitBtn.addEventListener('click',function(){
      const name=$('#mpName').value.trim();
      const senderCard=faToEn($('#mpSenderCard').value).replace(/[^\d]/g,'');
      const tracking=$('#mpTracking').value.trim();
      const payDate=$('#mpDate').value.trim();
      const payTime=$('#mpTime').value;
      const note=$('#mpNote').value.trim();
      const agree=$('#mpAgree').checked;

      if(!name){toast('نام واریز‌کننده رو وارد کن','err');return}
      if(!agree){toast('تأیید اطلاعات لازمه','err');return}

      // ساخت رکورد پرداخت
      const pay={
        id:uid(),
        userId:USER.id,
        userName:USER.name,
        userPhone:USER.phone,
        type:isSub?'sub':'coins',
        amount:amount,
        tracking:tracking||('TR-'+uid().slice(0,8)),
        status:'pending',
        createdAt:Date.now(),
        updatedAt:Date.now(),
        senderName:name,
        senderCard:senderCard||'',
        payDate:payDate,
        payTime:payTime,
        note:note,
        receiptKey:receiptKey,
        gateway:'manual'
      };

      // اگه اشتراک هست
      if(isSub){
        const plan=getCatalog().subs.find(function(s){return s.id===itemId});
        if(plan){
          pay.planId=plan.id;
          pay.planName=plan.name;
          pay.days=plan.days||0;
          pay.hours=plan.hours||0;
        }
      }else{
        // اگه سکه هست
        const pack=getCatalog().packs.find(function(p){return p.id===itemId});
        if(pack){pay.tokens=pack.tokens*(BUY.qty[itemId]||1)}
      }

      const pays=DB.get('payments',[]);
      pays.unshift(pay);
      DB.set('payments',pays);

      // ارسال اعلان به مدیر
      const adminUsers=DB.get('users',[]).filter(function(u){return u.role==='admin'&&!u.deleted});
      adminUsers.forEach(function(adm){
        sendNotification({
          userId:adm.id,
          title:'💳 رسید پرداخت جدید',
          body:'کاربر '+USER.name+' یه رسید پرداخت ارسال کرد.\nمبلغ: '+faN(amount)+' تومان\nنام: '+name,
          type:'gift'
        });
      });

      closeModal();
      toast('رسید شما ثبت شد! منتظر تأیید مدیر باشید.','gold');
      forceSyncNow();

      // نمایش صفحه موفقیت
      BUY.done={text:'رسید پرداخت شما ثبت شد.\nسکه‌ها بعد از تأیید مدیر به حساب شما اضافه می‌شن.'};
      BUY.step=2;
      renderBuyPage();
    });
  }
}

function deliverCoinsAfterMyketPayment(itemId){
  const pack=getCatalog().packs.find(function(p){return p.id===itemId});
  if(!pack){logSilentError('myket_pack_not_found','بسته یافت نشد: '+itemId);hidePaymentLoader();return}
  iapActivateAfterPayment('coins',itemId);
  const qty=BUY.qty[itemId]||1;
  if(qty>1){
    let count=1;
    const doNext=function(){
      if(count>=qty){BUY.done={text:faN(totalTokens())+' سکه به حساب شما اضافه شد.'};BUY.step=2;hidePaymentLoader();renderBuyPage();return}
      iapActivateAfterPayment('coins',itemId);count++;setTimeout(doNext,120);
    };
    setTimeout(doNext,200);
  }else{
    BUY.done={text:faN(totalTokens())+' سکه به حساب شما اضافه شد.'};
    BUY.step=2;hidePaymentLoader();renderBuyPage();
  }
}

function newBuyState(){
  const q={};getCatalog().packs.forEach(p=>q[p.id]=p.id==='p2'?1:0);
  return {step:1,mode:'coins',qty:q,planId:null,paying:false,done:null};
}
function buyItems(){return getCatalog().packs.map(p=>({id:p.id,tokens:p.tokens,price:p.price,qty:Math.max(0,BUY.qty[p.id]||0)})).filter(i=>i.qty>0)}
function totalPrice(){return buyItems().reduce((s,i)=>s+i.price*i.qty,0)}
function totalTokens(){return buyItems().reduce((s,i)=>s+i.tokens*i.qty,0)}
function buyBase(){if(BUY.mode==='sub'){const s=getCatalog().subs.find(x=>x.id===BUY.planId);return s?s.price:0}return totalPrice()}
function buyAmount(){return buyBase()}
function renderBuyPage(){
  const host=$('#pageHost');
  if(!BUY)BUY=newBuyState();
  BUY.mode=BUY.mode||'coins';
  const pays=DB.get('payments',[]).filter(p=>p.userId===USER.id&&p.gateway!=='myket');
  let inner='';
  if(BUY.step===1)inner=buyStep1HTML();else inner=buyDoneHTML();
  host.innerHTML=`<div class="page-head"><div><h2>خرید</h2></div></div>${inner}${pays.length?buyHistoryHTML(pays):''}`;
  bindBuy();
}

function bindBuy(){

  const ts=$('#tabSub');if(ts)ts.addEventListener('click',()=>{BUY.mode='sub';renderBuyPage()});

  host.querySelectorAll('.stepper button').forEach(b=>b.addEventListener('click',()=>{const pid=b.dataset.pack,d=+b.dataset.d;BUY.qty[pid]=Math.min(20,Math.max(0,(BUY.qty[pid]||0)+d));const row=b.closest('.pack');if(row)row.classList.toggle('dim',BUY.qty[pid]===0);const q=host.querySelector(`[data-qty="${pid}"]`);if(q)q.textContent=fa(BUY.qty[pid]);const total=$('.pay-total b');if(total&&BUY.mode==='coins')total.textContent=fmtPrice(buyAmount());const n=$('#payNow');if(n)n.disabled=totalTokens()===0}));

  for(const m of mtf.slice(1)){s+=m.dir==='buy'?8:m.dir==='sell'?-8:0;add(m.dir==='buy'?'bull':m.dir==='sell'?'bear':null,8,TF_FA[m.tf]+': '+(m.dir==='buy'?'صعودی':m.dir==='sell'?'نزولی':'خنثی'))}
  if(a.price>a.poc){s+=5;add('bull',5,'قیمت بالای POC')}
  else{s-=5;add('bear',5,'قیمت زیر POC')}
  const score=Math.round(clamp(50+s/2,2,98));
  return {score,dir:score>=60?'buy':score<=40?'sell':'neutral',reasons};
}
function buildPlan(a,v){
  const dir=v.dir==='neutral'?(a.ema20>a.ema50?'buy':'sell'):v.dir;
  let entry=a.price,entryNote='ورود بازار';
  const z=a.fvgs.find(z2=>z2.type===(dir==='buy'?'bull':'bear')&&(dir==='buy'?(z2.top<a.price&&a.price-z2.top<a.atrv*2):(z2.bottom>a.price&&z2.bottom-a.price<a.atrv*2)));
  if(z){entry=dir==='buy'?z.top:z.bottom;entryNote='ورود در FVG'}
  const stop=dir==='buy'?Math.min(a.low10-0.25*a.atrv,entry-1.2*a.atrv):Math.max(a.high10+0.25*a.atrv,entry+1.2*a.atrv);
  const risk=Math.abs(entry-stop)||a.atrv;
  const tp1=dir==='buy'?entry+1.5*risk:entry-1.5*risk;
  const tp2=dir==='buy'?entry+3*risk:entry-3*risk;
  return {dir,entry,entryNote,stop,tp1,tp2,risk};
}

async function closeFx(pid,pct,reason){
  const pos=DB.get('fxpos_'+USER.id,[]);const p=pos.find(x=>x.id===pid);if(!p){toast('پوزیشن یافت نشد','err');return}
  let price=p.mark||p.entry;
  try{const livePrice=await fetchPrice(p.sym);if(livePrice!=null)price=livePrice}catch(e){}
  const qty=p.qty*pct;
  const pnl=(p.side==='buy'?(price-p.entry):(p.entry-price))*qty;
  DB.set('fxbal_'+USER.id,Math.max(0,fxBal()+p.margin*pct+pnl));
  const hist=DB.get('fxhist_'+USER.id,[]);
  hist.unshift({id:uid(),sym:p.sym,side:p.side,entry:p.entry,exit:price,size:p.size*pct,lev:p.lev,pnl,reason,at:Date.now()});
  DB.set('fxhist_'+USER.id,hist.slice(0,500));
  if(pct>=1)DB.set('fxpos_'+USER.id,pos.filter(x=>x.id!==pid));
  else{p.qty*=1-pct;p.size*=1-pct;p.margin*=1-pct;DB.set('fxpos_'+USER.id,pos)}
  if(reason==='tp')toast('🎯 TP — سود: '+fp(pnl),'gold');
  else if(reason==='sl')toast('❌ SL — ضرر: '+fp(pnl),'err');
  else if(reason==='liq')toast('💥 لیکویید شد!','err');
  else toast((pct>=1?'بسته شد':'۵۰٪ بسته شد')+' — P&L: '+fp(pnl),pnl>=0?'gold':'err');
  if(VIEW==='fx')renderFxBody();
}
function startFxPriceUpdater(){
  stopFxPriceUpdater();
  FX_PRICE_TIMER=setInterval(async()=>{
    if(VIEW!=='fx'){stopFxPriceUpdater();return}
    const pos=DB.get('fxpos_'+USER.id,[]);
    if(!pos.length)return;
    const symsSet=new Set(pos.map(p=>p.sym));
    const prices={};
    await Promise.all([...symsSet].map(async s=>{const p=await fetchPrice(s);if(p!=null)prices[s]=p}));
    let changed=false;
    for(const p of pos){
      const newPrice=prices[p.sym];
      if(newPrice==null)continue;
      const oldMark=p.mark||p.entry;
      p.mark=newPrice;changed=true;
      const pnl=(p.side==='buy'?(newPrice-p.entry):(p.entry-newPrice))*p.qty;
      const roe=p.margin?pnl/p.margin*100:0;
      const pnlEl=document.querySelector(`[data-fxpnl="${p.id}"]`);
      if(pnlEl){const newHtml=`${pnl>=0?'+':''}${fp(pnl)} <span class="fx-roe-tag ${roe>=0?'pos':'neg'}">ROE ${roe>=0?'+':''}${roe.toFixed(1)}٪</span>`;pnlEl.innerHTML=newHtml;pnlEl.className='fx-position-pnl '+(pnl>=0?'pos':'neg')}
      const markEl=document.querySelector(`[data-fxmark="${p.id}"]`);
      if(markEl){markEl.textContent=fp(newPrice);markEl.classList.remove('flash-up','flash-down');void markEl.offsetWidth;if(newPrice>oldMark)markEl.classList.add('flash-up');else if(newPrice<oldMark)markEl.classList.add('flash-down')}
      const liq=p.side==='buy'?p.entry*(1-0.95/p.lev):p.entry*(1+0.95/p.lev);
      if(p.tp&&((p.side==='buy'&&newPrice>=p.tp)||(p.side==='sell'&&newPrice<=p.tp))){DB.set('fxpos_'+USER.id,pos);closeFx(p.id,1,'tp',newPrice);return}
      if(p.sl&&((p.side==='buy'&&newPrice<=p.sl)||(p.side==='sell'&&newPrice>=p.sl))){DB.set('fxpos_'+USER.id,pos);closeFx(p.id,1,'sl',newPrice);return}
      if((p.side==='buy'&&newPrice<=liq)||(p.side==='sell'&&newPrice>=liq)){DB.set('fxpos_'+USER.id,pos);closeFx(p.id,1,'liq',newPrice);return}
    }
    if(changed){DB.set('fxpos_'+USER.id,pos)}
  },2500);
}

async function decidePayment(pid,ok){

    p.status='approved';p.decidedAt=Date.now();p.updatedAt=Date.now();DB.set('payments',pays);await Store.persist('payments');

async function marketTick(){
  if(!USER)return;
  const alerts=alertsList();const pos=DB.get('fxpos_'+USER.id,[]);const sigs=DB.get('siglog_'+USER.id,[]);
  const syms=new Set();
  alerts.filter(a=>!a.done).forEach(a=>syms.add(a.sym));
  pos.forEach(p=>syms.add(p.sym));
  sigs.filter(s=>s.status==='pending').forEach(s=>syms.add(s.sym));
  if(!syms.size)return;
  const prices={};
  for(const s of syms){const p=await fetchPrice(s);if(p!=null)prices[s]=p}
  let ch=false;
  for(const a of alerts){if(a.done)continue;const p=prices[a.sym];if(p==null)continue;if((a.cond==='above'&&p>=a.price)||(a.cond==='below'&&p<=a.price)){a.done=true;a.hitAt=Date.now();a.hitPrice=p;ch=true;toast('🔔 '+a.sym+' → '+fp(p),'gold')}}
  if(ch)DB.set('alerts_'+USER.id,alerts);
  let sigCh=false;
  for(const s of sigs){if(s.status!=='pending')continue;const p=prices[s.sym];if(p==null)continue;if(s.dir==='buy'){if(p>=s.tp1){s.status='tp';sigCh=true;toast('✅ '+s.sym)}else if(p<=s.stop){s.status='sl';sigCh=true;toast('❌ '+s.sym,'err')}}else{if(p<=s.tp1){s.status='tp';sigCh=true;toast('✅ '+s.sym)}else if(p>=s.stop){s.status='sl';sigCh=true;toast('❌ '+s.sym,'err')}}}
  if(sigCh){DB.set('siglog_'+USER.id,sigs);if(VIEW==='analyze')renderSiglog()}
}

// گرفتن همه خطاهای برنامه و ارسال به مدیر
window.addEventListener('error',function(ev){
  try{
    const err={
      message:ev.message||'Unknown error',
      filename:ev.filename||'',
      line:ev.lineno||'',
      column:ev.colno||'',
      stack:ev.error&&ev.error.stack?ev.error.stack:''
    };
    logSilentError('window_error',err);
  }catch(e){}
});
window.addEventListener('unhandledrejection',function(ev){
  try{
    const reason=ev.reason;
    const err={
      message:reason&&reason.message?reason.message:String(reason),
      stack:reason&&reason.stack?reason.stack:''
    };
    logSilentError('unhandled_promise',err);
  }catch(e){}
});
// گرفتن خطاهای console.error
(function(){
  const origError=console.error;
  console.error=function(){
    try{
      const args=Array.from(arguments);
      const msg=args.map(a=>typeof a==='object'?(a&&a.message?String(a.message):JSON.stringify(a)):String(a)).join(' ');
      if(msg&&!msg.includes('MyketBridge')&&!msg.includes('Deprecation')&&!msg.includes('favicon')){
        logSilentError('console_error',{message:msg.slice(0,300)});
      }
    }catch(e){}
    origError.apply(console,arguments);
  };
})();
