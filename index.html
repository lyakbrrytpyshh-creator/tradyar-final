<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#11392A">
<title>ترید یار | پنل معاملاتی هوشمند</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:root{--paper:#F5F1E6;--paper-deep:#ECE6D5;--card:#FFFDF6;--ink:#232019;--ink-2:#6B655A;--ink-3:#A29A8B;--line:#E4DCC7;--line-2:#D3CBB1;--green:#1E6E4E;--green-deep:#15543B;--green-night:#11392A;--green-soft:#E2EEE5;--gold:#B4841F;--gold-deep:#8F6412;--gold-soft:#F7EFD9;--red:#B23A2E;--red-soft:#F7E7E3;--blue:#1E6FFF;--blue-soft:#E4EEFF;--purple:#7C4DBF;--purple-soft:#EFE4FA;--shadow:0 1px 2px rgba(70,60,30,.05),0 10px 30px rgba(70,60,30,.08);--radius:16px}
html,body{height:100%}
body{font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;color:var(--ink);background-color:var(--paper);background-image:radial-gradient(rgba(107,92,45,.07) 1px,transparent 1.1px);background-size:20px 20px;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background-color .25s,color .25s}
body.dark-theme{--paper:#0f1319;--paper-deep:#161c24;--card:#1a2029;--ink:#e9edf5;--ink-2:#a8b2c3;--ink-3:#6b7280;--line:#2a323d;--line-2:#38414e;--green-soft:#163829;--gold-soft:#3a2f14;--red-soft:#3a1f1c;--blue-soft:#152a4a;--purple-soft:#2a1f3a;--shadow:0 1px 2px rgba(0,0,0,.2),0 10px 30px rgba(0,0,0,.35);background-image:radial-gradient(rgba(255,255,255,.02) 1px,transparent 1.1px)}
::selection{background:var(--green-soft)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px}::-webkit-scrollbar-track{background:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;border:none;cursor:pointer;border-radius:12px;padding:11px 20px;background:var(--green);color:#F7F3E4;transition:.18s}
.btn:hover{background:var(--green-deep);transform:translateY(-1px)}.btn:active{transform:translateY(0)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn .ic{width:18px;height:18px}
.btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line-2)}
.btn-ghost:hover{border-color:var(--green);color:var(--green);background:var(--card)}
.btn-gold{background:var(--gold)}.btn-gold:hover{background:var(--gold-deep)}
.btn-danger{background:var(--red)}.btn-danger:hover{background:#8F2E24}
.btn-blue{background:var(--blue)}.btn-blue:hover{background:#1558cc}
.btn-purple{background:var(--purple)}.btn-purple:hover{background:#6236A3}
.btn-sm{padding:7px 14px;font-size:.86rem;border-radius:10px}.btn-block{width:100%}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-2);transition:.15s;flex:none}
.icon-btn:hover{color:var(--green);border-color:var(--green)}
.ic{width:20px;height:20px;flex:none}
.field{margin-bottom:14px}.field label{display:block;font-size:.85rem;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.input{width:100%;font:inherit;padding:11px 14px;border:1.5px solid var(--line-2);border-radius:11px;background:var(--card);color:var(--ink);transition:.15s;outline:none}
.input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.input::placeholder{color:var(--ink-3)}
textarea.input{resize:vertical;line-height:1.9}
.field .err{color:var(--red);font-size:.78rem;margin-top:5px;display:none}
.field.invalid .err{display:block}.field.invalid .input{border-color:var(--red)}
.hint{font-size:.78rem;color:var(--ink-3);margin-top:6px;line-height:1.8}.hint.center{text-align:center}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:.75rem;font-weight:700}
.badge-green{background:var(--green-soft);color:var(--green-deep)}
.badge-gold{background:var(--gold-soft);color:var(--gold-deep)}
.badge-red{background:var(--red-soft);color:var(--red)}
.badge-gray{background:var(--paper-deep);color:var(--ink-2)}
.badge-blue{background:var(--blue-soft);color:var(--blue)}
.badge-purple{background:var(--purple-soft);color:var(--purple)}
.m-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.m-actions.center{justify-content:center}
.m-acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.center{text-align:center}
.coin{width:19px;height:19px;border-radius:50%;position:relative;display:inline-block;flex:none}
.coin.filled{background:#D8A93E;border:1px solid #91682A;box-shadow:inset 0 -3px 0 rgba(120,80,10,.35)}
.coin.filled::after{content:'';position:absolute;inset:5px;border-radius:50%;border:1px solid rgba(120,80,10,.4)}
.coin.empty{border:1.5px dashed #C2B896}
.coin.pop{animation:coinpop .45s both}
@keyframes coinpop{from{transform:scale(0)}}
.coins-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.auth-wrap{min-height:100vh;display:flex}
.auth-brand{flex:0 0 42%;background:var(--green-night);color:#EFE9D6;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:52px 56px;overflow:hidden}
.auth-brand>*{position:relative}
.girih{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.brand-row{display:flex;align-items:center;gap:12px}
.brand-mark{width:44px;height:44px;border-radius:12px;background:#F2EBD5;color:var(--green-night);display:flex;align-items:center;justify-content:center;flex:none}
.brand-row b{font-size:1.25rem;font-weight:900;display:block}
.brand-row small{display:block;color:rgba(239,233,214,.55);font-size:.72rem}
.auth-hero h1{font-size:2.6rem;font-weight:900;line-height:1.4;margin-bottom:18px}
.auth-hero h1 mark{background:rgba(201,154,46,.30);color:inherit;padding:0 10px;border-radius:6px}
.auth-hero p{font-size:1rem;color:rgba(239,233,214,.72);line-height:2;max-width:38ch}
.auth-feats{display:flex;flex-direction:column;gap:14px;margin-top:34px}
.auth-feat{display:flex;gap:12px;align-items:center}
.auth-feat .fi{width:38px;height:38px;border-radius:11px;background:rgba(242,235,213,.12);display:flex;align-items:center;justify-content:center;color:#E2CFA0;flex:none}
.auth-feat .fi .ic{width:18px;height:18px}
.auth-feat span{font-size:.92rem}
.auth-free{display:flex;align-items:center;gap:12px;background:rgba(201,154,46,.16);border:1px solid rgba(201,154,46,.4);border-radius:14px;padding:14px 18px;font-size:.9rem;color:rgba(239,233,214,.85)}
.auth-free .coin{width:15px;height:15px}
.auth-free b{color:#E9C46A}
.auth-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 24px}
.auth-card{width:100%;max-width:430px;padding:34px 32px}
.auth-tabs{display:flex;background:var(--paper-deep);border-radius:12px;padding:4px;margin-bottom:24px}
.auth-tabs button{flex:1;padding:10px;border:none;background:transparent;border-radius:9px;font:inherit;font-weight:700;color:var(--ink-2);cursor:pointer;transition:.15s}
.auth-tabs button.on{background:var(--card);color:var(--green);box-shadow:0 1px 4px rgba(60,50,20,.08)}
.auth-title{font-size:1.4rem;font-weight:800;margin-bottom:4px}
.auth-sub{color:var(--ink-2);font-size:.9rem;margin-bottom:22px}
.auth-mini{display:none;align-items:center;gap:10px;margin-bottom:22px;color:var(--green)}
.auth-mini .ic{width:26px;height:26px}
.auth-mini b{font-weight:900;font-size:1.15rem}
.auth-mini small{display:block;color:var(--ink-3);font-size:.72rem}
.pw-wrap{position:relative}
.pw-wrap .input{padding-inline-end:46px}
.pw-eye{position:absolute;inset-inline-end:5px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:none;background:none;color:var(--ink-3);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
.app{display:flex;height:100vh;height:100dvh;overflow:hidden}
.sidebar{position:fixed;inset-block:0;inset-inline-start:0;width:252px;background:var(--card);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:14px;z-index:40;overflow-y:auto}
.side-brand{display:flex;gap:10px;align-items:center;padding:4px 8px 12px}
.side-brand .brand-mark{width:38px;height:38px;background:var(--green);color:#F2EBD5;border-radius:11px}
.side-brand b{font-weight:900;font-size:1.05rem;display:block}
.side-brand small{display:block;color:var(--ink-3);font-size:.7rem}
.side-nav{display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.side-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border:none;background:transparent;border-radius:11px;font:inherit;font-weight:600;color:var(--ink-2);cursor:pointer;transition:.15s;text-align:start;width:100%}
.side-item .ic{width:19px;height:19px}
.side-item:hover{background:var(--paper);color:var(--ink)}
.side-item.on{background:var(--green-soft);color:var(--green-deep);font-weight:700;box-shadow:inset -3px 0 0 var(--green)}
.side-item .side-badge{margin-inline-start:auto;background:var(--red);color:#fff;font-size:.68rem;font-weight:800;padding:2px 7px;border-radius:99px;min-width:18px;text-align:center}
.side-item .side-cost{margin-inline-start:auto;background:var(--gold-soft);color:var(--gold-deep);font-size:.68rem;font-weight:800;padding:2px 7px;border-radius:99px;min-width:18px;text-align:center}
.side-icon{width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.18);transition:.2s}
.side-icon .ic{width:16px;height:16px}
.side-item:hover .side-icon{transform:scale(1.08) rotate(-3deg)}
.side-icon.c-chart{background:linear-gradient(135deg,#1E6FFF,#4F8CFF)}
.side-icon.c-ai{background:linear-gradient(135deg,#10a37f,#1a7f64)}
.side-icon.c-prices{background:linear-gradient(135deg,#1E9E6A,#4ADE80)}
.side-icon.c-vip{background:linear-gradient(135deg,#B4841F,#E9C46A)}
.side-icon.c-tour{background:linear-gradient(135deg,#B23A2E,#F87171)}
.side-icon.c-edu{background:linear-gradient(135deg,#1E6E4E,#4ADE80)}
.side-icon.c-bell{background:linear-gradient(135deg,#F59E0B,#FBBF24)}
.side-icon.c-journal{background:linear-gradient(135deg,#7C3AED,#A78BFA)}
.side-icon.c-fx{background:linear-gradient(135deg,#0EA5E9,#22D3EE)}
.side-icon.c-alert{background:linear-gradient(135deg,#EF4444,#F87171)}
.side-icon.c-brain{background:linear-gradient(135deg,#EC4899,#F472B6)}
.side-icon.c-risk{background:linear-gradient(135deg,#0F766E,#14B8A6)}
.side-icon.c-rules{background:linear-gradient(135deg,#6366F1,#818CF8)}
.side-icon.c-buy{background:linear-gradient(135deg,#F59E0B,#D97706)}
.side-icon.c-profile{background:linear-gradient(135deg,#0891B2,#22D3EE)}
.side-icon.c-admin{background:linear-gradient(135deg,#1F2937,#4B5563)}
.side-token{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:auto}
.st-head{display:flex;justify-content:space-between;font-size:.76rem;color:var(--ink-2);font-weight:700;margin-bottom:9px}
.st-extra{display:flex;align-items:center;gap:6px;font-size:.74rem;color:var(--gold-deep);font-weight:700;margin-bottom:10px}
.st-extra .ic{width:14px;height:14px}
.st-buy{margin-top:2px}
.st-next{margin-top:11px;text-align:center;font-size:.73rem;color:var(--ink-2)}
.st-next b{color:var(--gold-deep);font-variant-numeric:tabular-nums}
.side-user{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--green-soft);color:var(--green-deep);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.avatar.sm{width:30px;height:30px;font-size:.8rem}
.su-info{flex:1;min-width:0}
.su-info b{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.su-info small{color:var(--ink-3);font-size:.72rem}
.side-backdrop{display:none;position:fixed;inset:0;background:rgba(20,18,10,.4);z-index:35}
.main{flex:1;margin-inline-start:252px;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;min-width:0}
.mobile-top{display:none}
.page{flex:1;min-height:0;overflow-y:auto;padding:28px 34px 60px}
.page>*{animation:pagein .3s ease}
@keyframes pagein{from{opacity:0;transform:translateY(6px)}}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h2{font-size:1.45rem;font-weight:800}
.page-head .sub{color:var(--ink-2);font-size:.88rem;margin-top:4px}
.notice-bar{display:flex;gap:10px;align-items:center;background:var(--gold-soft);border-bottom:1px solid #E8D3A4;color:var(--gold-deep);padding:10px 16px;font-size:.84rem;font-weight:600;line-height:1.8}
.notice-bar .ic{width:16px;height:16px;flex:none}
#pageHost.chart-mode{padding:0;position:relative;background:#0e1117;overflow:hidden}
.chart-fill{position:absolute;inset:0}
.chart-fill iframe{width:100%;height:100%;border:none;display:block}
.chart-dock{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:4px;background:rgba(13,16,24,.85);backdrop-filter:blur(18px);border:1px solid rgba(56,64,82,.55);border-radius:16px;padding:6px;box-shadow:0 14px 44px rgba(0,0,0,.55);max-width:calc(100% - 20px)}
.cd-btn{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.04);border:1px solid transparent;color:#c7cdd6;border-radius:11px;padding:8px 13px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .22s}
.cd-btn:hover{background:rgba(255,255,255,.09);color:#fff}
.cd-btn svg{width:15px;height:15px;flex-shrink:0}
.cd-hero{background:linear-gradient(135deg,#1e6fff,#4f8cff);color:#fff;box-shadow:0 4px 16px rgba(30,111,255,.35)}
.cd-hero:hover{transform:translateY(-1px)}
.chart-charge-badge{position:absolute;top:14px;inset-inline-end:14px;z-index:60;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,rgba(180,132,31,.95),rgba(143,100,18,.95));backdrop-filter:blur(12px);border:1px solid rgba(232,211,164,.55);border-radius:14px;padding:8px 14px;color:#fff;font-family:inherit;font-size:12.5px;font-weight:800;box-shadow:0 8px 24px rgba(180,132,31,.45);pointer-events:none;transition:transform .3s}
.chart-charge-badge svg{width:16px;height:16px;flex-shrink:0}
.chart-charge-badge .ccb-time{font-variant-numeric:tabular-nums;direction:ltr;font-weight:900;letter-spacing:.5px}
.chart-charge-badge .ccb-label{opacity:.9}
.chart-charge-badge.danger{background:linear-gradient(135deg,rgba(178,58,46,.95),rgba(143,46,36,.95));border-color:rgba(228,183,174,.55);box-shadow:0 8px 24px rgba(178,58,46,.5);animation:ccbPulse 1.2s ease-in-out infinite}
.chart-charge-badge.warn{background:linear-gradient(135deg,rgba(30,110,78,.95),rgba(21,84,59,.95));border-color:rgba(191,216,200,.55);box-shadow:0 8px 24px rgba(30,110,78,.5)}
@keyframes ccbPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.chart-pause-overlay{position:absolute;inset:0;z-index:70;background:rgba(8,10,16,.85);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;padding:20px;animation:anpFadeInUp .3s}
.chart-pause-card{width:min(440px,96vw);background:linear-gradient(165deg,rgba(22,26,36,.99),rgba(12,14,20,.99));border:1px solid rgba(180,132,31,.5);border-radius:20px;padding:26px 24px;text-align:center;color:#eef1f6;box-shadow:0 24px 80px rgba(0,0,0,.7)}
.chart-pause-card .cpc-ic{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#B4841F,#D8A93E);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 8px 24px rgba(180,132,31,.4)}
.chart-pause-card .cpc-ic svg{width:30px;height:30px;color:#fff}
.chart-pause-card h3{font-size:1.15rem;font-weight:900;color:#f1f4f9;margin-bottom:8px}
.chart-pause-card p{font-size:.88rem;line-height:2;color:#c7cdd6;margin-bottom:6px}
.chart-pause-card .cpc-remain{color:#E9C46A;font-weight:900;font-variant-numeric:tabular-nums;direction:ltr}
.chart-pause-card .cpc-actions{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
@media(max-width:640px){.chart-dock{bottom:10px}.cd-btn span{display:none}.cd-btn{padding:10px}.chart-charge-badge{font-size:11px;padding:6px 10px;top:10px;inset-inline-end:10px}}
@keyframes anpFadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes anpSheetUp{from{opacity:0;transform:translateY(70px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes anpPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
@keyframes anpSpin{to{transform:rotate(360deg)}}
.anp-ov{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);z-index:2100;display:flex;align-items:flex-end;justify-content:center;animation:anpFadeInUp .3s}
.anp{width:min(820px,96vw);max-height:90vh;overflow-y:auto;background:linear-gradient(165deg,rgba(22,26,36,.99),rgba(12,14,20,.99));border:1px solid rgba(42,47,58,.5);border-radius:20px 20px 16px 16px;padding:22px 22px 18px;margin-bottom:12px;box-shadow:0 -20px 80px rgba(0,0,0,.6);position:relative;animation:anpSheetUp .5s cubic-bezier(.16,1,.3,1) both}
.anp::-webkit-scrollbar{width:4px}.anp::-webkit-scrollbar-thumb{background:#2a2f3a;border-radius:4px}
.anp .close-x{position:absolute;top:14px;left:16px;cursor:pointer;color:#6b7280;font-size:20px;background:rgba(255,255,255,.05);border:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .3s;font-family:inherit;z-index:5}
.anp .close-x:hover{background:rgba(239,68,68,.15);color:#ef4444;transform:rotate(90deg)}
.anp .panel-h2{color:#f1f4f9;font-size:18px;font-weight:800;margin-bottom:14px;padding-left:36px}
.anp .panel-h2 span{background:linear-gradient(135deg,#1e6fff,#4f8cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.anp .tf-row{display:flex;flex-wrap:wrap;gap:5px;background:rgba(255,255,255,.03);border:1px solid #232a38;border-radius:11px;padding:4px;margin-bottom:14px}
.anp .tf-btn{flex:1 1 17%;min-width:64px;background:transparent;border:none;color:#8a94a6;font-family:inherit;font-size:10.5px;font-weight:700;padding:8px 0;border-radius:8px;cursor:pointer;transition:all .2s;white-space:nowrap}
.anp .tf-btn:hover{color:#e6e6e6}
.anp .tf-btn.active{background:linear-gradient(135deg,#1e6fff,#4f8cff);color:#fff;box-shadow:0 4px 14px rgba(30,111,255,.3)}
.anp .load-steps{display:flex;flex-direction:column;gap:10px;margin:8px 0 6px}
.anp .load-step{display:flex;align-items:center;gap:10px;font-size:12.5px;color:#5b6272;transition:all .3s}
.anp .load-step.active{color:#c7cdd6}.anp .load-step.done{color:#22c55e}
.anp .ls-ico{width:19px;height:19px;border-radius:50%;border:1.5px solid #2a2f3a;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;transition:all .3s}
.anp .load-step.active .ls-ico{border-color:#4f8cff;border-top-color:transparent;animation:anpSpin .8s linear infinite}
.anp .load-step.done .ls-ico{border-color:#22c55e;background:rgba(34,197,94,.12)}
.anp .progress-container{width:100%;background:#1a1f2e;border-radius:10px;margin:8px 0;overflow:hidden}
.anp .progress-bar{height:6px;background:linear-gradient(90deg,#1e6fff,#4f8cff);width:0;border-radius:10px;transition:width .4s}
.anp .status-text{color:#8a94a6;font-size:12px;text-align:center;margin-top:6px;min-height:18px}
.anp .error-text{color:#ef4444;font-size:13px;font-weight:600;text-align:center;padding:14px 0;line-height:1.8}

.fx-field input[type="range"]{width:100%;accent-color:var(--gold);cursor:pointer;padding:6px 0}
#fxLevVal{color:var(--gold-deep);font-weight:800}
#fxLiqPrev{margin-top:10px;padding:10px 12px;border-radius:9px;background:var(--paper);border:1px dashed var(--line-2);font-size:.78rem;color:var(--ink-2);display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fx-prev-item{text-align:center}
.fx-prev-item .fp-l{font-size:.6rem;color:var(--ink-3);font-weight:700;display:block;margin-bottom:2px}
.fx-prev-item .fp-v{font-size:.82rem;font-weight:800;color:var(--ink);direction:ltr;display:block}
.fx-prev-item .fp-v.neg{color:var(--red)}
.fx-live{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:800;color:var(--green-deep);background:var(--green-soft);padding:4px 10px;border-radius:99px}
.fx-live::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green);animation:fxLive 1.5s ease-in-out infinite}
@keyframes fxLive{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}
.fx-position{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;position:relative;overflow:hidden}
.fx-position::before{content:'';position:absolute;top:0;bottom:0;inset-inline-start:0;width:4px}
.fx-position.long::before{background:linear-gradient(180deg,#16a34a,#4ade80)}
.fx-position.short::before{background:linear-gradient(180deg,#dc2626,#f87171)}
.fx-position-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.fx-position-sym{font-size:.95rem;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:7px;direction:ltr}
.fx-pos-tag{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:6px}
.fx-pos-tag.long{background:var(--green-soft);color:var(--green-deep)}
.fx-pos-tag.short{background:var(--red-soft);color:var(--red)}
.fx-pos-lev{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--gold-soft);color:var(--gold-deep)}
.fx-position-pnl{font-size:1rem;font-weight:800;direction:ltr;display:flex;align-items:center;gap:6px;transition:color .2s}
.fx-position-pnl.pos{color:var(--green-deep)}.fx-position-pnl.neg{color:var(--red)}
.fx-roe-tag{font-size:.68rem;font-weight:700;padding:1px 7px;border-radius:6px}
.fx-roe-tag.pos{background:var(--green-soft);color:var(--green-deep)}
.fx-roe-tag.neg{background:var(--red-soft);color:var(--red)}
.fx-position-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.fx-position-item{background:var(--paper-deep);border-radius:8px;padding:6px 8px;font-size:.72rem;color:var(--ink-3)}
.fx-position-item .fpi-val{font-weight:700;color:var(--ink);display:block;margin-top:2px;direction:ltr;text-align:right}
.fx-position-item .fpi-val.liq{color:var(--red)}
.fx-position-item .fpi-val.tp{color:var(--green-deep)}
.fx-position-item .fpi-val.sl{color:var(--red)}
.fx-position-item .fpi-val.flash-up{animation:flashUp .6s}
.fx-position-item .fpi-val.flash-down{animation:flashDown .6s}
@keyframes flashUp{0%{background:rgba(34,197,94,.35);color:#15803d}100%{background:transparent}}
@keyframes flashDown{0%{background:rgba(239,68,68,.35);color:#b91c1c}100%{background:transparent}}
.fx-risk-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.fx-risk-bar{flex:1;height:6px;background:var(--paper-deep);border-radius:4px;overflow:hidden}
.fx-risk-fill{height:100%;border-radius:4px;transition:width .5s,background .3s}
.fx-risk-fill.safe{background:var(--green)}.fx-risk-fill.warn{background:var(--gold)}.fx-risk-fill.danger{background:var(--red)}
.fx-tp-sl-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:.68rem;font-weight:800}
.fx-tp-sl-badge.tp{background:var(--green-soft);color:var(--green-deep)}
.fx-tp-sl-badge.sl{background:var(--red-soft);color:var(--red)}
.side-toggle{display:flex;gap:6px}

.side-toggle button.buy.active{background:var(--green-soft);border-color:var(--green);color:var(--green-deep)}
.side-toggle button.sell.active{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.step-ind{display:flex;gap:6px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
.si{display:flex;align-items:center;gap:7px;font-size:.78rem;font-weight:700;color:var(--ink-3)}

.si.on{color:var(--green)} .si.on .sn{background:var(--green);color:#fff}
.si.done{color:var(--green-deep)} .si.done .sn{background:var(--green-soft);color:var(--green-deep)}
.sep{color:var(--ink-3);display:flex}.sep .ic{width:14px;height:14px}

.pack-info{display:flex;align-items:center;gap:13px}

.sub-ic{width:44px;height:44px;border-radius:12px;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;flex:none}
.pack-info b{display:block;font-size:1.05rem;font-weight:800}

.pack.dim{opacity:.55}

.stepper b{width:54px;text-align:center;font-size:1.05rem}
.pay-total{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--gold-soft);border:1px solid #E8D3A4;border-radius:13px;padding:14px 20px;margin-bottom:18px;flex-wrap:wrap}

.pay-total b{color:var(--gold-deep);font-size:1.2rem;font-weight:900}

.tour-timer:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 8px 24px rgba(180,132,31,.12)}
.tour-timer::before{content:'';position:absolute;top:0;inset-inline-start:0;inset-inline-end:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--purple))}
.tour-timer-l{font-size:.7rem;color:var(--ink-3);font-weight:800;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.tour-timer-v{font-size:1.15rem;font-weight:900;color:var(--gold-deep);display:block;font-variant-numeric:tabular-nums;direction:ltr}
.tour-stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.tour-stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center;position:relative;overflow:hidden;transition:.2s}
.tour-stat:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(30,110,78,.1)}
.tour-stat-ic{width:40px;height:40px;border-radius:12px;background:var(--green-soft);color:var(--green-deep);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:1.2rem}
.tour-stat b{font-size:1.35rem;font-weight:900;display:block;color:var(--ink);direction:ltr}
.tour-stat span{font-size:.72rem;color:var(--ink-2);font-weight:700;display:block;margin-top:3px}
.tour-stat .tour-confidential{font-size:1.1rem;font-weight:900;color:var(--ink-3);direction:ltr;letter-spacing:3px}
.tour-section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:var(--shadow)}
.tour-section-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.tour-section-head .ic{width:20px;height:20px;color:var(--gold-deep);flex:none}
.tour-section-head h3{font-size:1.05rem;font-weight:900;color:var(--ink);flex:1}
.tour-section-head .tour-section-badge{font-size:.68rem;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--gold-soft);color:var(--gold-deep);border:1px solid #E8D3A4}
.tour-info-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tour-info-item{flex:1;min-width:120px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.tour-info-item .tii-l{font-size:.68rem;color:var(--ink-3);font-weight:800;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
.tour-info-item .tii-v{font-size:.98rem;font-weight:900;color:var(--ink);display:block;direction:ltr}
.tour-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.tour-actions .btn{flex:1;min-width:150px}
.tourn-board-new{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:14px;box-shadow:var(--shadow)}
.tourn-row-new{display:grid;grid-template-columns:60px 1.5fr 1fr 1fr 1fr auto;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-size:.86rem;transition:.15s}
.tourn-row-new:last-child{border:none}

.tourn-rank-new{font-weight:900;font-size:1.15rem;text-align:center;display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:var(--paper);color:var(--gold-deep);margin:0 auto}

.tourn-rank-new.top3{background:linear-gradient(135deg,#F0C9A0,#CD7F32);color:#5A2E00}

.tourn-pnl-new{font-weight:900;direction:ltr;text-align:center;font-size:.95rem}
.tourn-pnl-new.pos{color:var(--green-deep)}
.tourn-pnl-new.neg{color:var(--red)}
.tourn-pct-new{font-weight:800;direction:ltr;text-align:center;font-size:.85rem;padding:4px 10px;border-radius:8px;display:inline-block}
.tourn-pct-new.pos{background:var(--green-soft);color:var(--green-deep)}
.tourn-pct-new.neg{background:var(--red-soft);color:var(--red)}
.tourn-status-new{font-size:.7rem;font-weight:800;padding:4px 12px;border-radius:99px;white-space:nowrap}

.tourn-status-new.kicked{background:var(--red-soft);color:var(--red);border:1px solid #E4B7AE}
.tourn-conf-row{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--paper);border:1px dashed var(--line-2);border-radius:12px;font-size:.82rem;color:var(--ink-2);margin-bottom:8px}
.tourn-conf-row .tourn-conf-ic{width:32px;height:32px;border-radius:9px;background:var(--purple-soft);color:var(--purple);display:flex;align-items:center;justify-content:center;flex:none}

@media(max-width:800px){.tourn-row-new{grid-template-columns:44px 1fr auto;gap:8px;padding:12px 12px;font-size:.78rem}.tourn-row-new .tr-hide-new{display:none}.tourn-rank-new{width:34px;height:34px;font-size:1rem}}
.tour-empty{text-align:center;padding:50px 24px;background:var(--card);border:1px dashed var(--line-2);border-radius:18px}

.tour-prizes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.tour-prize{background:linear-gradient(135deg,var(--gold-soft),#F0DBA0);border:1px solid #E8D3A4;border-radius:14px;padding:14px;text-align:center;position:relative;overflow:hidden;transition:.2s}
.tour-prize:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(180,132,31,.2)}

.tour-prize-amount{font-size:1.25rem;font-weight:900;color:var(--gold-deep);display:block;direction:ltr}
.tour-prize-amount small{font-size:.7rem;font-weight:700;color:var(--gold-deep);opacity:.75;display:block;margin-top:3px}
.tour-pro{background:#0a0e1a;border-radius:16px;padding:20px;color:#eef1f6;font-family:'Vazirmatn',sans-serif}

.tour-pro-bal{background:linear-gradient(135deg,rgba(30,111,255,.15),rgba(79,140,255,.1));border:1px solid rgba(79,140,255,.3);border-radius:14px;padding:12px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}

.tour-pro-pos-side.short{background:rgba(239,68,68,.15);color:#ef4444}
.tour-pro-pos-lev{font-size:.68rem;font-weight:800;padding:2px 8px;border-radius:6px;background:rgba(180,132,31,.15);color:#D8A93E}
.tour-pro-pos-pnl{font-size:1.05rem;font-weight:900;direction:ltr;display:flex;align-items:center;gap:8px}
.tour-pro-pos-pnl.pos{color:#22c55e}
.tour-pro-pos-pnl.neg{color:#ef4444}
.tour-pro-pos-roe{font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:6px}
.tour-pro-pos-roe.pos{background:rgba(34,197,94,.15);color:#22c55e}
.tour-pro-pos-roe.neg{background:rgba(239,68,68,.15);color:#ef4444}

.tour-pro-empty{text-align:center;padding:30px;color:#5b6272;font-size:.85rem}

<script>
/* ============================================================
   ترید یار — v70 (نهایی و بدون خطا)
   - درگاه پرداخت مایکت با پل بومی و کلید عمومی جدید
   - سیستم خوددرمانی و مخفی‌سازی خطاها از کاربر
   - ارسال خطاها به مدیر
   ============================================================ */
const SOUND=(()=>{
  let ctx=null;let enabled=true;
  function getCtx(){if(ctx)return ctx;try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}return ctx}
  function unlock(){const c=getCtx();if(c&&c.state==='suspended'){c.resume().catch(()=>{})}}
  function play(type){
    if(!enabled)return;const c=getCtx();if(!c)return;
    if(c.state==='suspended'){c.resume().catch(()=>{})}
    try{
      const now=c.currentTime;const o=c.createOscillator();const g=c.createGain();
      o.connect(g);g.connect(c.destination);
      const preset={click:{freq:660,dur:.06,vol:.045,type:'sine'},soft:{freq:520,dur:.08,vol:.04,type:'sine'},tap:{freq:780,dur:.05,vol:.035,type:'sine'},success:{freq:880,dur:.12,vol:.05,type:'sine',freq2:1180},error:{freq:320,dur:.14,vol:.05,type:'sine',freq2:260},coin:{freq:1050,dur:.10,vol:.05,type:'sine',freq2:1400}};
      const p=preset[type]||preset.click;o.type=p.type;o.frequency.setValueAtTime(p.freq,now);
      if(p.freq2)o.frequency.exponentialRampToValueAtTime(p.freq2,now+p.dur);
      g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(p.vol,now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+p.dur);
      o.start(now);o.stop(now+p.dur+.02);
    }catch(e){}
  }
  function setEnabled(v){enabled=!!v}
  return {play,unlock,setEnabled};
})();
document.addEventListener('touchstart',()=>SOUND.unlock(),{once:true,passive:true});
document.addEventListener('mousedown',()=>SOUND.unlock(),{once:true});
document.addEventListener('click',function(e){
  if(!(e.target instanceof Element))return;
  const btn=e.target.closest('button, .btn, .icon-btn, .side-item, .tab, .chip, .pack, .stepper button, [role="button"], .sub-hourly, .cd-btn, .jdate-day, .jdate-nav, .jdate-foot button, .price-box, .edu-lesson-head, .tk-head, .tourn-row-new, .ai-send, .ai-attach-btn, .ai-hbtn, .payout-type, .theme-opt');
  if(!btn)return;
  if(btn.disabled||btn.getAttribute('aria-disabled')==='true')return;
  if(btn.classList.contains('btn-danger')||btn.classList.contains('tk-close-btn')||btn.dataset.sound==='error')SOUND.play('error');
  else if(btn.classList.contains('btn-gold')||btn.classList.contains('btn')||btn.dataset.sound==='coin'){if(btn.classList.contains('btn-gold'))SOUND.play('coin');else SOUND.play('soft')}
  else if(btn.classList.contains('side-item')||btn.classList.contains('tab'))SOUND.play('tap');
  else if(btn.classList.contains('icon-btn')||btn.classList.contains('cd-btn'))SOUND.play('tap');
  else SOUND.play('click');

  if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365;}

    mem.clear();const entries=Object.entries(kv||{});
    for(const[k,v]of entries)mem.set(k,String(v));
    try{localStorage.clear()}catch(e){}
    for(const[k,v]of entries){try{localStorage.setItem('tyar_'+k,String(v))}catch(e){}}
    for(let i=0;i<POOL_COUNT;i++){try{await IDB.rq(i,'kv','readwrite',s=>s.clear())}catch(e){}poolUsed[i]=0}
    let p=0;
    for(const[k,v]of entries){const size=String(v).length;while(p<POOL_COUNT&&poolUsed[p]+size>POOL_STATS[p].size)p++;if(p>=POOL_COUNT)p=0;try{await IDB.rq(p,'kv','readwrite',s=>s.put(String(v),k))}catch(e){}poolUsed[p]+=size}
    updatePoolStats();
  }
  function flush(){return new Promise(res=>{drainQueue();setTimeout(res,700)})}
  function getPoolStats(){updatePoolStats();return POOL_STATS.map((s,i)=>({index:i,name:s.name,size:s.size,used:s.used,available:s.available,percent:s.size?Math.min(100,s.used/s.size*100):0}))}
  return {init,persist,persistDel,all,restore,flush,rawGet:k=>mem.get(k),rawSet(k,v){mem.set(k,v)},rawDel(k){mem.delete(k)},getPoolStats,persisted:()=>STORAGE_PERSISTED};
})();
const DB={
  get(k,f){
    try{
      let s=Store.rawGet(k);
      if(s==null){try{const ls=localStorage.getItem('tyar_'+k);if(ls!=null){s=ls;Store.rawSet(k,ls)}}catch(e){}}
      return s==null?f:safeJSON(s,f);
    }catch(e){return f}
  },
  set(k,v){try{const s=JSON.stringify(v);Store.rawSet(k,s);Store.persist(k);return true}catch(e){return false}},
  del(k){Store.rawDel(k);Store.persistDel(k)}
};
const Blobs={
  put:(k,v)=>{let p=0;for(let i=0;i<POOL_COUNT;i++){if(POOL_STATS[i].available>1000000){p=i;break}}return IDB.rq(p,'blobs','readwrite',s=>s.put(v,k)).catch(()=>null)},
  get:(k)=>{let prom=Promise.resolve(null);for(let i=0;i<Math.min(POOL_COUNT,300);i++){prom=prom.then(r=>{if(r)return r;return IDB.rq(i,'blobs','readonly',s=>s.get(k)).catch(()=>null)})}return prom},
  del:(k)=>{for(let i=0;i<POOL_COUNT;i++){IDB.rq(i,'blobs','readwrite',s=>s.delete(k)).catch(()=>null)}return Promise.resolve(true)},
  keys:async()=>{let all=[];for(let i=0;i<Math.min(POOL_COUNT,300);i++){try{const keys=await IDB.rq(i,'blobs','readonly',s=>s.getAllKeys());all=all.concat(keys||[])}catch(e){}}return all}
};

async function fetchServer(endpoint,opts,timeoutMs){
  const ctl=new AbortController();const t0=setTimeout(()=>ctl.abort(),timeoutMs);
  try{const r=await fetch(endpoint,Object.assign({},opts,{signal:ctl.signal,cache:'no-store'}));clearTimeout(t0);return r}catch(e){clearTimeout(t0);throw e}
}

    const unknown=[];
    for(let i=0;i<SERVER_ENDPOINTS.length;i++){if(i===activeServerIdx)continue;if(ok.indexOf(i)<0)unknown.push(i)}
    order.push(...ok,...unknown);
    let bestDoc=null,bestIdx=-1,bestTime=-1,anyOk=false;
    for(const idx of order){
      try{
        const r=await fetchServer(SERVER_ENDPOINTS[idx],{method:'GET'},5000);
        if(!r.ok){serverHealth[idx]={idx,ok:false,lastCheck:Date.now()};continue}
        const txt=await r.text();serverHealth[idx]={idx,ok:true,lastCheck:Date.now()};anyOk=true;
        if(!txt||!txt.trim())continue;
        const lines=txt.split('\n').filter(l=>l.trim());
        let doc=null;
        for(let i=lines.length-1;i>=0;i--){try{const j=safeJSON(lines[i],null);if(j&&j.v){doc=j;break}}catch(e){}}
        if(!doc){try{const j=safeJSON(txt,null);if(j&&j.v)doc=j}catch(e){}}
        if(doc){const t=doc.syncedAt||(doc.settings&&doc.settings.updatedAt)||0;if(t>bestTime){bestTime=t;bestDoc=doc;bestIdx=idx}}
      }catch(e){serverHealth[idx]={idx,ok:false,lastCheck:Date.now()}}
    }
    if(bestDoc){activeServerIdx=bestIdx;return {ok:true,doc:bestDoc,idx:bestIdx}}
    if(anyOk){return {ok:true,doc:null,idx:activeServerIdx}}
    try{const cached=DB.get(SERVER_CACHE_KEY,null);if(cached){return {ok:true,doc:cached,idx:-1,cached:true}}}catch(e){}
    return {ok:false,reason:'all_servers_failed'};
  },

function dedupeUsers(users){
  const byPhone={};const noPhone=[];
  (users||[]).forEach(u=>{
    if(!u)return;const ph=u.phone||'';
    if(!ph){noPhone.push(u);return}
    const cur=byPhone[ph];
    if(!cur){byPhone[ph]=u;return}
    const a=u.updatedAt||0,b=cur.updatedAt||0;
    if(a>b){if(cur.deleted!==true){cur.deleted=true;cur.updatedAt=Math.max(cur.updatedAt||0,a)}byPhone[ph]=u}
    else{if(u.deleted!==true){u.deleted=true;u.updatedAt=Math.max(u.updatedAt||0,b)}}
  });
  const result=[];const seen=new Set();
  Object.values(byPhone).forEach(u=>{if(!u.deleted){const ph=u.phone;if(!seen.has(ph)){seen.add(ph);result.push(u)}}});
  noPhone.forEach(u=>result.push(u));
  return result;
}
function mergeByUpdated(a,b){

}

      if(!txt)throw new Error('EMPTY');
      return txt;
    }
    const msgs=messages.map(m=>({role:m.role,content:m.content}));
    if(imageDataUrl && ep.supportsImages){
      const base64=imageDataUrl.split(',')[1];
      const mime=(imageDataUrl.match(/data:([^;]+);/)||[])[1]||'image/jpeg';
      const last=msgs[msgs.length-1];
      const contentArr=[{type:'text',text:(last&&last.content)||'این تصویر را تحلیل کن.'},{type:'image_url',image_url:{url:'data:'+mime+';base64,'+base64}}];
      if(last){last.content=contentArr}
    }
    const s=getAISettings();
    const body={model:ep.model,messages:msgs,temperature:Number(s.temperature)||0.75,max_tokens:Number(s.maxTokens)||3000,stream:false};
    const r=await fetch(ep.url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:merged});
    if(!r.ok)throw new Error('HTTP_'+r.status);
    const j=await r.json();
    const txt=j&&j.choices&&j.choices[0]?(j.choices[0].message?j.choices[0].message.content:j.choices[0].text):'';
    if(!txt)throw new Error('EMPTY');
    return typeof txt==='string'?txt:JSON.stringify(txt);
  }finally{clearTimeout(to)}
}
async function aiRequest(messages,imageDataUrl,signal){
  const s=getAISettings();
  const sys=s.systemPrompt||'';
  const full=[];
  if(sys)full.push({role:'system',content:sys});
  messages.forEach(m=>{if(m.role==='user'||m.role==='assistant')full.push({role:m.role,content:m.content})});
  let lastErr=null;
  const health=s.endpointHealth||[];
  const order=AI_ENDPOINTS.map((_,i)=>i).sort((a,b)=>{
    const ha=health[a]||{},hb=health[b]||{};
    const sa=ha.ok?0:1,sb=hb.ok?0:1;
    if(sa!==sb)return sa-sb;
    const ta=ha.at||0,tb=hb.at||0;
    return ta-tb;
  });
  for(const i of order){
    const ep=AI_ENDPOINTS[i];
    try{
      const out=await aiRequestOnce(ep,full,imageDataUrl,signal);
      if(out&&out.trim()){
        const st=getAISettings();
        st.endpointHealth=st.endpointHealth||[];
        st.endpointHealth[i]={ok:true,at:Date.now()};
        st.activeEndpoint=i;
        saveAISettings(st);
        return {text:out.trim(),endpoint:ep};
      }
    }catch(e){
      lastErr=e;
      const st=getAISettings();
      st.endpointHealth=st.endpointHealth||[];
      st.endpointHealth[i]={ok:false,at:Date.now(),err:String(e&&e.message||e).slice(0,60)};
      saveAISettings(st);
    }
  }
  throw lastErr||new Error('ALL_FAILED');
}

function escapeHTML(t){return String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function renderInline(text){
  let t=escapeHTML(text);
  t=t.replace(/`([^`]+)`/g,'<code>$1</code>');
  t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/__([^_]+)__/g,'<strong>$1</strong>');
  t=t.replace(/(^|[^\*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>');
  t=t.replace(/(^|[^_])_([^_\n]+)_(?!_)/g,'$1<em>$2</em>');
  t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return t;
}
function renderMarkdown(md){
  if(!md)return '';
  let src=String(md).replace(/\r\n/g,'\n');
  const lines=src.split('\n');
  const out=[];
  let i=0;
  let paragraph=[];
  let listStack=null;
  let inCode=false;
  let codeLines=[];
  let codeLang='';
  const flushParagraph=()=>{
    if(paragraph.length){
      const text=paragraph.join(' ').trim();
      if(text)out.push(`<p>${renderInline(text)}</p>`);
      paragraph=[];
    }
  };
  const closeList=()=>{
    if(listStack){out.push(`</${listStack}>`);listStack=null;}
  };
  const openList=(type)=>{
    if(listStack===type)return;
    closeList();out.push(`<${type}>`);listStack=type;
  };
  while(i<lines.length){
    let line=lines[i];
    if(/^\s*```/.test(line)){
      if(!inCode){flushParagraph();closeList();inCode=true;codeLang=line.replace(/^\s*```/,'').trim();codeLines=[];i++;continue;}
      else{inCode=false;const cls=codeLang?` class="lang-${escapeHTML(codeLang)}"`:'';out.push(`<pre><code${cls}>${escapeHTML(codeLines.join('\n'))}</code></pre>`);codeLines=[];codeLang='';i++;continue;}
    }
    if(inCode){codeLines.push(line);i++;continue;}
    if(/^\s*$/.test(line)){flushParagraph();closeList();i++;continue;}
    if(/^\s*([-*_])\1{2,}\s*$/.test(line)){flushParagraph();closeList();out.push('<hr>');i++;continue;}
    const h=line.match(/^\s*(#{1,6})\s+(.*)$/);
    if(h){flushParagraph();closeList();const lvl=h[1].length;out.push(`<h${lvl}>${renderInline(h[2].trim())}</h${lvl}>`);i++;continue;}
    if(/^\s*>\s?/.test(line)){flushParagraph();closeList();const block=[];while(i<lines.length && /^\s*>\s?/.test(lines[i])){block.push(lines[i].replace(/^\s*>\s?/,''));i++;}out.push(`<blockquote>${renderInline(block.join(' '))}</blockquote>`);continue;}
    if(/\|/.test(line) && i+1<lines.length && /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?\s*$/.test(lines[i+1])){
      flushParagraph();closeList();
      const header=line.split('|').map(s=>s.trim()).filter((s,idx,arr)=>!(idx===0&&s==='')&&!(idx===arr.length-1&&s===''));
      i+=2;
      const rows=[];
      while(i<lines.length && /\|/.test(lines[i]) && !/^\s*$/.test(lines[i])){
        const cells=lines[i].split('|').map(s=>s.trim()).filter((s,idx,arr)=>!(idx===0&&s==='')&&!(idx===arr.length-1&&s===''));
        if(cells.length)rows.push(cells);i++;
      }
      let table=`<table><thead><tr>${header.map(c=>`<th>${renderInline(c)}</th>`).join('')}</tr></thead><tbody>`;
      rows.forEach(r=>{table+=`<tr>${r.map(c=>`<td>${renderInline(c)}</td>`).join('')}</tr>`});
      table+='</tbody></table>';out.push(table);continue;
    }
    const ol=line.match(/^\s*(\d+)[\.\)]\s+(.*)$/);
    if(ol){flushParagraph();openList('ol');out.push(`<li>${renderInline(ol[2].trim())}</li>`);i++;continue;}
    const ul=line.match(/^\s*[-*+]\s+(.*)$/);
    if(ul){flushParagraph();openList('ul');out.push(`<li>${renderInline(ul[1].trim())}</li>`);i++;continue;}
    paragraph.push(line);i++;
  }
  flushParagraph();closeList();
  if(inCode){out.push(`<pre><code>${escapeHTML(codeLines.join('\n'))}</code></pre>`);}
  return `<div class="ai-md">${out.join('')}</div>`;
}

function compressImage(file,maxSize=1280,quality=.82){
  return new Promise((resolve,reject)=>{
    try{
      const img=new Image();const url=URL.createObjectURL(file);
      img.onload=()=>{
        URL.revokeObjectURL(url);
        let {width:w,height:h}=img;
        if(w>h&&w>maxSize){h=Math.round(h*maxSize/w);w=maxSize}
        else if(h>maxSize){w=Math.round(w*maxSize/h);h=maxSize}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('IMG_ERR'))};
      img.src=url;
    }catch(e){reject(e)}
  });
}

function logSilentError(context,err){
  try{
    // گرفتن اطلاعات کامل خطا
    const errObj=err&&err.message?err:((err&&typeof err==='object')?err:{message:String(err)});
    const msg=String(errObj.message||errObj).slice(0,500);
    const stack=errObj.stack?String(errObj.stack).slice(0,1500):'';
    const entry={
      context,
      msg,
      stack,
      at:Date.now(),
      userAgent:(navigator.userAgent||'').slice(0,200),
      url:(window.location.href||'').slice(0,200),
      line:errObj.lineNumber||errObj.line||'',
      column:errObj.columnNumber||errObj.column||'',
      userId:USER?USER.id:'',
      userName:USER?USER.name:'',
      view:VIEW||''
    };
    SILENT_ERRORS.unshift(entry);
    if(SILENT_ERRORS.length>500)SILENT_ERRORS=SILENT_ERRORS.slice(0,500);
    // ثبت در لاگ خوددرمانی
    pushSelfHealLog('bad',context+': '+msg.slice(0,80));
    // ذخیره خطا در دیتابیس برای بررسی مدیر
    try{
      const errorLog=DB.get('errorLog',[]);
      errorLog.unshift(entry);
      if(errorLog.length>1000)errorLog.splice(1000);
      DB.set('errorLog',errorLog);
    }catch(e){}
    // ارسال خطا به مدیر (به صورت notification)
    try{
      const adminUsers=DB.get('users',[]).filter(u=>u.role==='admin'&&!u.deleted);
      const lastErrorSent=DB.get('lastErrorSent_'+context,0);
      // جلوگیری از ارسال تکراری در کمتر از ۵ دقیقه
      if(Date.now()-lastErrorSent>300000){
        DB.set('lastErrorSent_'+context,Date.now());
        adminUsers.forEach(adm=>{
          const notifs=DB.get('notifications',[]);
          // جلوگیری از تکرار زیاد (در ۱۰ دقیقه)
          const existing=notifs.find(n=>n.userId===adm.id&&n.title==='⚠️ خطای سیستمی'&&n.body.includes(context)&&(Date.now()-n.at)<600000);
          if(!existing){
            notifs.unshift({
              id:uid(),userId:adm.id,title:'⚠️ خطای سیستمی',
              body:'بخش: '+context+'\nپیام: '+msg+(stack?'\nStack: '+stack.slice(0,300):'')+'\nزمان: '+fmtDateTime(Date.now())+(USER?'\nکاربر: '+USER.name:''),
              type:'alert',at:Date.now(),updatedAt:Date.now(),readBy:[],senderName:'سیستم خوددرمانی',deleted:false
            });
            DB.set('notifications',notifs.slice(0,500));
          }
        });
      }
    }catch(e){}
    // ارسال به سرور برای همگام‌سازی
    try{PENDING_PUSH=true;}catch(e){}
  }catch(e){}
}

function detectBugs(){
  const bugs=[];
  try{let okCount=0;for(let i=0;i<Math.min(POOL_COUNT,300);i++){if(POOL_STATS[i].active)okCount++}if(okCount===0)bugs.push({id:'idb_fail',sev:'high',title:'IndexedDB در دسترس نیست',desc:'هیچ‌کدام از مخازن باز نشدند.'})}catch(e){bugs.push({id:'idb_err',sev:'high',title:'خطا در IndexedDB',desc:String(e.message||e)})}
  const okServers=serverHealth.filter(s=>s&&s.ok).length;
  if(okServers===0&&serverHealth.length>0)bugs.push({id:'srv_all_fail',sev:'high',title:'همه سرورها قطع',desc:'اتصال به هیچ‌کدام از '+SERVER_ENDPOINTS.length+' سرور برقرار نشد.'});
  else if(okServers<SERVER_ENDPOINTS.length/2&&serverHealth.length>0)bugs.push({id:'srv_some_fail',sev:'mid',title:'بیشتر سرورها قطع',desc:'فقط '+faN(okServers)+' از '+faN(SERVER_ENDPOINTS.length)+' فعال.'});
  try{localStorage.setItem('tyar_test','1');localStorage.removeItem('tyar_test')}catch(e){bugs.push({id:'ls_fail',sev:'mid',title:'localStorage در دسترس نیست',desc:String(e.message||e)})}
  try{const pools=Store.getPoolStats();const fullPools=pools.filter(p=>p.percent>95);if(fullPools.length>10)bugs.push({id:'pool_full',sev:'mid',title:faN(fullPools.length)+' مخزن پر',desc:'مخازن با مصرف بیش از ۹۵٪.'})}catch(e){}
  try{const sess=DB.get('session',null);if(sess&&sess.uid){const u=DB.get('users',[]).find(x=>x.id===sess.uid&&!x.deleted);if(!u)bugs.push({id:'sess_orphan',sev:'low',title:'نشست یتیم',desc:'نشست به کاربر حذف‌شده اشاره می‌کند.'})}}catch(e){}
  if(PENDING_PUSH)bugs.push({id:'pending_push',sev:'low',title:'ارسال معوق به سرور',desc:'یک بسته در صف ارسال مانده.'});
  const lastSync=DB.get('serverLastSync',0);
  if(lastSync&&Date.now()-lastSync>300000)bugs.push({id:'sync_stale',sev:'mid',title:'همگام‌سازی قدیمی',desc:'آخرین همگام‌سازی بیش از ۵ دقیقه پیش.'});
  if(!USER)bugs.push({id:'no_user',sev:'high',title:'کاربر شناسایی نشد',desc:'نشست کاربر وجود ندارد.'});
  try{const c=DB.get('catalog',null);if(c&&(!Array.isArray(c.packs)||!Array.isArray(c.subs)||!c.packs.length||!c.subs.length))bugs.push({id:'catalog_broken',sev:'mid',title:'کاتالوگ خراب',desc:'ساختار پکیج‌ها/اشتراک‌ها معتبر نیست.'})}catch(e){}
  try{const st=DB.get('settings',null);if(st&&(typeof st.card!=='string'))bugs.push({id:'settings_broken',sev:'mid',title:'تنظیمات خراب',desc:'ساختار تنظیمات فروش نامعتبر است.'})}catch(e){}
  try{const u=DB.get('users',[]);if(Array.isArray(u)){const seen=new Set();let dup=0;u.forEach(x=>{if(x&&x.phone){if(seen.has(x.phone)&&!x.deleted)dup++;seen.add(x.phone)}});if(dup>0)bugs.push({id:'dup_users',sev:'low',title:faN(dup)+' کاربر تکراری',desc:'شماره تکراری با وضعیت active.'})}}catch(e){}
  try{const c=getCosts();if(typeof c!=='object')bugs.push({id:'costs_broken',sev:'mid',title:'تنظیم هزینه‌ها خراب',desc:'ساختار هزینه‌ها معتبر نیست.'})}catch(e){}
  if(typeof renderShell!=='function'||typeof renderAuth!=='function')bugs.push({id:'functions_missing',sev:'high',title:'توابع اصلی نیستند',desc:'بعضی توابع حیاتی تعریف نشده‌اند.'});
  return bugs;
}
async function autoFixBugs(){
  const fixed=[];const bugs=detectBugs();
  for(const b of bugs){
    try{
      if(b.id==='srv_all_fail'||b.id==='srv_some_fail'){await SERVER.pingAll();fixed.push('بررسی مجدد سرورها')}
      if(b.id==='pending_push'){await forceSyncNow();fixed.push('ارسال بسته معوق')}
      if(b.id==='sess_orphan'){DB.del('session');fixed.push('پاک کردن نشست یتیم')}
      if(b.id==='sync_stale'){await forceSyncNow();fixed.push('همگام‌سازی اجباری')}
      if(b.id==='idb_err'||b.id==='idb_fail'){try{await IDB.open(0)}catch(e){};fixed.push('تلاش مجدد IndexedDB')}
      if(b.id==='pool_full'){await Store.flush();fixed.push('تخلیه صف نوشتن')}
      if(b.id==='no_user'){try{logout()}catch(e){};fixed.push('بازگشت به صفحه ورود')}
      if(b.id==='catalog_broken'){DB.set('catalog',{packs:DEFAULT_PACKS.slice(),subs:DEFAULT_SUBS.slice(),updatedAt:Date.now()});fixed.push('بازسازی کاتالوگ')}
      if(b.id==='settings_broken'){DB.set('settings',{card:DEFAULT_CARD,bank:DEFAULT_BANK,cardOwner:DEFAULT_CARD_OWNER,notice:'',updatedAt:Date.now()});fixed.push('بازسازی تنظیمات')}
      if(b.id==='costs_broken'){DB.set('costs',Object.assign({},DEFAULT_COSTS));fixed.push('بازسازی هزینه‌ها')}
      if(b.id==='dup_users'){DB.set('users',dedupeUsers(DB.get('users',[])));fixed.push('حذف کاربران تکراری')}
      if(b.id==='functions_missing'){fixed.push('نیاز به رفرش')}
    }catch(e){}
  }
  if(fixed.length){fixed.forEach(f=>pushSelfHealLog('ok',f));}
  return fixed;
}

function getErrorReport(){
  const errors=SILENT_ERRORS||[];
  const errorLog=DB.get('errorLog',[]);
  const now=Date.now();
  const last1h=errors.filter(e=>e.at&&(now-e.at)<3600000);
  const last24h=errors.filter(e=>e.at&&(now-e.at)<86400000);
  const last7d=errors.filter(e=>e.at&&(now-e.at)<604800000);

  // گروه‌بندی خطاها بر اساس context
  const byContext={};
  errors.forEach(e=>{
    if(!byContext[e.context])byContext[e.context]={count:0,lastAt:0,examples:[]};
    byContext[e.context].count++;
    if(e.at>byContext[e.context].lastAt)byContext[e.context].lastAt=e.at;
    if(byContext[e.context].examples.length<3){
      byContext[e.context].examples.push({msg:e.msg,at:e.at});
    }
  });

  const sortedContexts=Object.entries(byContext).sort((a,b)=>b[1].count-a[1].count);

  return {
    total:errors.length,
    last1h:last1h.length,
    last24h:last24h.length,
    last7d:last7d.length,
    byContext:sortedContexts.map(([ctx,data])=>({context:ctx,count:data.count,lastAt:data.lastAt,examples:data.examples})),
    recent:errors.slice(0,20)
  };
}

function showPage(v){

  }

    else if(v==='fx')renderFxPage();
    else if(v==='alerts')renderAlertsPage();
    else if(v==='psychology')renderPsychologyPage();
    else if(v==='risk')renderRiskPage();
    else if(v==='rules')renderRulesPage();
    else if(v==='buy')renderBuyPage();
    else if(v==='profile')renderProfilePage();
    else if(v==='payouts')renderPayoutsPage();

async function closeTourPosition(t,posId,pct){
  const all=DB.get('tournaments',[]);const tt=all.find(x=>x.id===t.id);const mp=tt.participants.find(p=>p.uid===USER.id);
  const posIdx=mp.positions.findIndex(p=>p.id===posId);if(posIdx<0)return;
  const p=mp.positions[posIdx];const price=await fetchPrice(p.sym);
  if(!price){toast('قیمت دریافت نشد','err');return}
  const qty=p.size/p.entry;const closeQty=qty*pct;
  const pnl=(p.side==='buy'?(price-p.entry):(p.entry-price))*closeQty;const closeMargin=p.margin*pct;
  mp.currentBalance+=closeMargin+pnl;mp.pnl=mp.currentBalance-tt.initialBalance;
  if(pct>=1){mp.positions.splice(posIdx,1)}else{p.size*=1-pct;p.margin*=1-pct}
  mp.trades=mp.trades||[];mp.trades.push({sym:p.sym,side:p.side,entry:p.entry,exit:price,pnl,at:Date.now()});
  if(mp.currentBalance<=tt.initialBalance*(1-tt.kickPercent/100)){mp.kicked=true;toast('شما از مسابقه اخراج شدید!','err')}
  tt.updatedAt=Date.now();DB.set('tournaments',all);toast('پوزیشن بسته شد — P&L: '+fp(pnl),pnl>=0?'gold':'err');closeModal();tourTradingModal(tt);
}
function startTourPriceUpdater(t){
  if(TOURNAMENT_PRICE_INTERVAL)clearInterval(TOURNAMENT_PRICE_INTERVAL);
  TOURNAMENT_PRICE_INTERVAL=setInterval(async()=>{
    const all=DB.get('tournaments',[]);const tt=all.find(x=>x.id===t.id);if(!tt)return;
    const mp=tt.participants.find(p=>p.uid===USER.id);if(!mp)return;
    const balEl=document.getElementById('tpBalance');const pnlEl=document.getElementById('tpPnl');const pctEl=document.getElementById('tpPct');
    if(balEl)balEl.textContent='$'+fp(mp.currentBalance);
    if(pnlEl){pnlEl.textContent=(mp.pnl>=0?'+':'')+'$'+fp(mp.pnl);pnlEl.className='tpb-v '+(mp.pnl>=0?'pos':'neg')}
    if(pctEl){const pct=mp.pnl/tt.initialBalance*100;pctEl.textContent=(pct>=0?'+':'')+fa(pct.toFixed(1))+'٪';pctEl.className='tpb-v '+(pct>=0?'pos':'neg')}
    for(const p of (mp.positions||[])){
      try{
        const price=await fetchPrice(p.sym);if(!price)continue;
        p.mark=price;
        const pnl=(p.side==='buy'?(price-p.entry):(p.entry-price))*(p.size/p.entry);
        const roe=p.margin?pnl/p.margin*100:0;
        const pnlEl2=document.querySelector(`[data-pospnl="${p.id}"]`);
        if(pnlEl2){pnlEl2.innerHTML=`${pnl>=0?'+':''}$${fp(pnl)} <span class="tour-pro-pos-roe ${roe>=0?'pos':'neg'}">ROE ${roe>=0?'+':''}${fa(roe.toFixed(1))}٪</span>`;pnlEl2.className='tour-pro-pos-pnl '+(pnl>=0?'pos':'neg')}
        const markEl=document.querySelector(`[data-posmark="${p.id}"]`);if(markEl)markEl.textContent=fp(price);
        if(p.tp&&((p.side==='buy'&&price>=p.tp)||(p.side==='sell'&&price<=p.tp))){await closeTourPosition(t,p.id,1);return}
        if(p.sl&&((p.side==='buy'&&price<=p.sl)||(p.side==='sell'&&price>=p.sl))){await closeTourPosition(t,p.id,1);return}
      }catch(e){logSilentError('tourPriceUpdate',e)}
    }
    DB.set('tournaments',all);
  },3000);
}

  init:function(cb){

    this.setupInProgress=true;
    const self=this;
    const tryInit=function(attempt){
      try{
        const native=self.findBridge();
        if(native){
          self.bridge=native;
          if(typeof native.startSetup==='function'){
            try{native.startSetup(MYKET_PUBLIC_KEY)}catch(e){logSilentError('myket_startSetup',e)}
          }
          setTimeout(function(){
            if(typeof native.isSetup==='function'){
              try{self.ready=!!native.isSetup()}catch(e){self.ready=true}
            }else{self.ready=true}
            self.setupInProgress=false;
            if(self.ready){
              self.retryCount=0;
              self.queryInventoryOnStartup();
              cb&&cb(true);
            }else{
              if(attempt<self.maxRetries){
                setTimeout(function(){tryInit(attempt+1)},1500);
              }else{cb&&cb(false)}
            }
          },1500);
          return;
        }
        if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.myket){
          self.bridge={ios:true};self.ready=true;
          try{window.webkit.messageHandlers.myket.postMessage(JSON.stringify({action:'startSetup',publicKey:MYKET_PUBLIC_KEY}))}catch(e){logSilentError('myket_ios_setup',e)}
          self.setupInProgress=false;cb&&cb(true);return;
        }
        if(attempt<self.maxRetries){
          logSilentError('myket_retry','bridge پیدا نشد، تلاش '+attempt);
          setTimeout(function(){tryInit(attempt+1)},1500);
        }else{
          self.bridge=null;self.ready=false;self.setupInProgress=false;
          logSilentError('myket_bridge_not_found','JavaScript Bridge مایکت پیدا نشد - استفاده از URL Scheme');
          cb&&cb(false);
        }
      }catch(e){
        logSilentError('myket_init_error',e);
        if(attempt<self.maxRetries){setTimeout(function(){tryInit(attempt+1)},1500)}
        else{self.setupInProgress=false;cb&&cb(false)}
      }
    };
    tryInit(1);
  },

  queryInventoryOnStartup:function(){
    if(!this.bridge||!this.ready){return}
    const itemSkus=['tradyar_coins_p1','tradyar_coins_p2','tradyar_coins_p3','tradyar_sub_sh1','tradyar_sub_sh2','tradyar_sub_sh3','tradyar_sub_sh4','tradyar_sub_sh5','tradyar_sub_s1','tradyar_sub_s2','tradyar_sub_s3'];
    const subSkus=[];
    this.queryInventory(itemSkus,subSkus,function(inv){
      if(!inv){return}
      const purchases=inv.purchases||inv.mPurchaseMap||[];
      if(Array.isArray(purchases)&&purchases.length>0){
        purchases.forEach(function(purchase){
          const sku=purchase.sku||purchase.mSku;
          const token=purchase.token||purchase.mToken;
          if(!sku||!token)return;
          const coinMap={'tradyar_coins_p1':'p1','tradyar_coins_p2':'p2','tradyar_coins_p3':'p3'};
          const subMap={'tradyar_sub_sh1':'sh1','tradyar_sub_sh2':'sh2','tradyar_sub_sh3':'sh3','tradyar_sub_sh4':'sh4','tradyar_sub_sh5':'sh5','tradyar_sub_s1':'s1','tradyar_sub_s2':'s2','tradyar_sub_s3':'s3'};
          if(coinMap[sku]){
            logSilentError('myket_pending_purchase','خرید مصرف‌نشده: '+sku);
            MYKET.consume(purchase,function(ok){
              if(ok){iapActivateAfterPayment('coins',coinMap[sku])}
            });
            return;
          }
          if(subMap[sku]){iapActivateAfterPayment('sub',subMap[sku])}
        });
      }
    });
  },

  purchase:function(productId,isSub,cb){
    const itemType='inapp';
    const developerPayload=uid()+'_'+Date.now();
    this.pendingPayloads[developerPayload]=productId;
    const onResult=function(res){
      if(!res){cb&&cb({success:false,error:'empty_response'});return}
      if(typeof res==='string'){try{res=JSON.parse(res)}catch(e){}}
      if(res&&(res.isSuccess||res.success||res.purchase||res.purchaseToken)){
        const purchase=res.purchase||res;
        const token=purchase.token||purchase.purchaseToken||purchase.mToken||res.purchaseToken;
        const returnedPayload=purchase.developerPayload||purchase.mDeveloperPayload;
        if(returnedPayload&&MYKET.pendingPayloads[returnedPayload]&&MYKET.pendingPayloads[returnedPayload]!==productId){
          delete MYKET.pendingPayloads[developerPayload];
          cb&&cb({success:false,error:'payload_mismatch'});return;
        }
        delete MYKET.pendingPayloads[developerPayload];
        cb&&cb({success:true,purchase:{token:token,orderId:purchase.orderId||purchase.mOrderId||'',sku:purchase.sku||purchase.mSku||productId,itemType:purchase.itemType||purchase.mItemType||itemType,purchaseTime:purchase.purchaseTime||purchase.mPurchaseTime||Date.now(),purchaseState:purchase.purchaseState||purchase.mPurchaseState||0,developerPayload:returnedPayload||developerPayload,originalJson:purchase.originalJson||purchase.mOriginalJson||'',signature:purchase.signature||purchase.mSignature||''}});
      }else if(res&&(res.cancelled||res.isCancelled)){
        delete MYKET.pendingPayloads[developerPayload];
        cb&&cb({success:false,error:'cancelled'});
      }else{
        delete MYKET.pendingPayloads[developerPayload];
        const errMsg=res&&res.message?res.message:(res&&res.error?res.error:'failed');
        logSilentError('myket_purchase_failed',errMsg+' برای '+productId);
        cb&&cb({success:false,error:errMsg});
      }
    };
    if(this.bridge){
      const b=this.bridge;
      try{
        if(typeof b.launchPurchaseFlow==='function'){b.launchPurchaseFlow(productId,itemType,developerPayload,onResult);return}
        if(b.ios&&window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.myket){
          window.myketPurchaseCallback=onResult;
          window.webkit.messageHandlers.myket.postMessage(JSON.stringify({action:'launchPurchaseFlow',productId:productId,itemType:itemType,developerPayload:developerPayload}));
          return;
        }
        if(typeof b.purchase==='function'){b.purchase(productId,itemType,developerPayload,onResult);return}
        if(typeof b.buy==='function'){b.buy(productId,itemType,developerPayload,onResult);return}
        if(typeof b.startPurchase==='function'){b.startPurchase(productId,itemType,developerPayload,onResult);return}
      }catch(e){logSilentError('myket_bridge_call',e)}
    }
    this.openViaUrlScheme(productId,isSub,developerPayload,cb);
  },

  openViaUrlScheme:function(productId,isSub,developerPayload,cb){
    const itemType='inapp';
    const myketScheme='myket://details?package_name='+encodeURIComponent(MYKET_PACKAGE_NAME)+'&sku='+encodeURIComponent(productId)+'&type='+itemType;
    const myketWeb='https://myket.ir/app/'+encodeURIComponent(MYKET_PACKAGE_NAME);
    const callbackId='cb_'+Date.now()+'_'+uid();
    this.purchaseCallbacks[callbackId]={cb:cb,productId:productId,isSub:isSub,developerPayload:developerPayload,at:Date.now()};
    let opened=false;
    try{
      const ifr=document.createElement('iframe');
      ifr.style.display='none';ifr.src=myketScheme;document.body.appendChild(ifr);
      setTimeout(function(){ifr.remove()},2000);
      opened=true;
    }catch(e){logSilentError('myket_iframe',e)}
    if(!opened){
      try{window.location.href=myketScheme;opened=true}catch(e){logSilentError('myket_location',e)}
    }
    if(!opened){
      try{const win=window.open(myketScheme,'_blank');if(win){opened=true}}catch(e){logSilentError('myket_window_open',e)}
    }
    const oldHref=window.location.href;
    setTimeout(function(){
      if(document.visibilityState==='visible'&&window.location.href===oldHref){
        logSilentError('myket_app_not_installed','مایکت نصب نیست - باز کردن نسخه وب');
        try{window.open(myketWeb,'_blank')}catch(e){try{window.location.href=myketWeb}catch(e2){}}
      }
    },2500);
    if(!this.visibilityListenerAdded){
      this.visibilityListenerAdded=true;
      document.addEventListener('visibilitychange',function(){if(!document.hidden){setTimeout(function(){MYKET.verifyPendingPurchases()},1000)}});
      window.addEventListener('focus',function(){setTimeout(function(){MYKET.verifyPendingPurchases()},1000)});
      window.addEventListener('pagehide',function(){setTimeout(function(){MYKET.verifyPendingPurchases()},1000)});
    }
    const self=this;
    setTimeout(function(){
      if(self.purchaseCallbacks[callbackId]){
        delete self.purchaseCallbacks[callbackId];
        logSilentError('myket_timeout','کاربر از مایکت برنگشت یا پرداخت انجام نشد');
        cb&&cb({success:false,error:'timeout'});
      }
    },300000);
  },

  verifyPendingPurchases:function(){
    const callbacks=this.purchaseCallbacks;
    if(!callbacks)return;
    if(Object.keys(callbacks).length===0)return;
    if(this.bridge){
      const b=this.bridge;
      const onInvResult=function(res){
        if(!res){return}
        if(typeof res==='string'){try{res=JSON.parse(res)}catch(e){return}}
        for(const id in callbacks){
          const item=callbacks[id];
          const purchase=res.purchase||res.purchases||[];
          let found=null;
          if(Array.isArray(purchase)){found=purchase.find(function(p){return(p.sku||p.mSku)===item.productId})}
          if(found){
            if(!item.isSub){
              MYKET.consume(found,function(ok){if(ok){delete callbacks[id];item.cb&&item.cb({success:true,purchase:found})}});
            }else{delete callbacks[id];item.cb&&item.cb({success:true,purchase:found})}
          }
        }
      };
      try{
        if(typeof b.queryInventoryAsync==='function'){
          const skus=Object.values(callbacks).map(function(c){return c.productId});
          b.queryInventoryAsync(true,JSON.stringify(skus),'[]',onInvResult);return;
        }
        if(typeof b.queryInventory==='function'){
          const skus=Object.values(callbacks).map(function(c){return c.productId});
          b.queryInventory(true,skus,[],onInvResult);return;
        }
      }catch(e){logSilentError('myket_verify',e)}
    }
  },

  consume:function(purchase,cb){
    const token=(typeof purchase==='string')?purchase:(purchase.token||purchase.purchaseToken||purchase.mToken);
    if(!token){cb&&cb(false);return}
    if(!this.bridge){cb&&cb(false);return}
    const b=this.bridge;
    const onResult=function(res){
      if(!res){cb&&cb(false);return}
      if(typeof res==='string'){try{res=JSON.parse(res)}catch(e){}}
      cb&&cb(!!(res&&(res.isSuccess||res.success)));
    };
    try{
      if(typeof b.consumeAsync==='function'){b.consumeAsync(token,onResult);return}
      if(typeof b.consume==='function'){b.consume(token,onResult);return}
      if(typeof b.consumePurchase==='function'){b.consumePurchase(token,onResult);return}
      cb&&cb(true);
    }catch(e){logSilentError('myket_consume',e);cb&&cb(false)}
  },

  queryInventory:function(itemSkus,subSkus,cb){
    if(!this.bridge){cb&&cb(null);return}
    const b=this.bridge;
    const onResult=function(res){
      if(!res){cb&&cb(null);return}
      if(typeof res==='string'){try{res=JSON.parse(res)}catch(e){}}
      cb&&cb(res);
    };
    try{
      if(typeof b.queryInventoryAsync==='function'){
        const items=Array.isArray(itemSkus)?JSON.stringify(itemSkus):itemSkus;
        const subs=Array.isArray(subSkus)?JSON.stringify(subSkus):subSkus;
        b.queryInventoryAsync(true,items,subs,onResult);return;
      }
      if(typeof b.queryInventory==='function'){b.queryInventory(true,itemSkus,subSkus,onResult);return}
      cb&&cb(null);
    }catch(e){logSilentError('myket_query',e);cb&&cb(null)}
  }
};

window.myketOnSetupFinished=function(result){
  MYKET.ready=!!(result&&(result.isSuccess||result.success));
  MYKET.setupInProgress=false;
  if(MYKET.ready){MYKET.queryInventoryOnStartup()}
};
window.myketOnPurchaseFinished=function(result){
  if(window.myketPurchaseCallback){window.myketPurchaseCallback(result);window.myketPurchaseCallback=null}
};
window.myketOnConsumeFinished=function(result){
  if(window.myketConsumeCallback){window.myketConsumeCallback(result);window.myketConsumeCallback=null}
};
window.myketOnQueryInventoryFinished=function(result){
  if(window.myketQueryInventoryCallback){window.myketQueryInventoryCallback(result);window.myketQueryInventoryCallback=null}
};

function initMyketOnStartup(){
  try{
    MYKET.init(function(ok){
      if(ok){logSilentError('myket_ready','سرویس مایکت آماده شد')}
    });
  }catch(e){logSilentError('myket_init_startup',e)}
}
function iapProductIdFor(type,itemId){return type==='sub'?('tradyar_sub_'+itemId):('tradyar_coins_'+itemId)}
function iapActivateAfterPayment(type,itemId){
  const cat=getCatalog();
  if(type==='sub'){
    const plan=cat.subs.find(s=>s.id===itemId);if(!plan)return false;
    grantSub(USER.id,plan.days||0,plan.hours||0);
    const pay={id:uid(),userId:USER.id,userName:USER.name,userPhone:USER.phone,type:'sub',amount:plan.price,tracking:'IAP-'+uid(),status:'approved',createdAt:Date.now(),updatedAt:Date.now(),planId:plan.id,planName:plan.name,days:plan.days||0,hours:plan.hours||0,tokens:0,gateway:'myket'};
    const pays=DB.get('payments',[]);pays.unshift(pay);DB.set('payments',pays);
    sendNotification({userId:USER.id,title:'اشتراک فعال شد ✅',body:'اشتراک «'+plan.name+'» با موفقیت فعال شد.',type:'gift'});
    toast('اشتراک فعال شد ✅','gold');forceSyncNow();return true;
  }
  const pack=cat.packs.find(p=>p.id===itemId);if(!pack)return false;
  addCoins(USER.id,pack.tokens);
  const pay={id:uid(),userId:USER.id,userName:USER.name,userPhone:USER.phone,type:'coins',amount:pack.price,tracking:'IAP-'+uid(),status:'approved',createdAt:Date.now(),updatedAt:Date.now(),tokens:pack.tokens,gateway:'myket'};
  const pays=DB.get('payments',[]);pays.unshift(pay);DB.set('payments',pays);
  sendNotification({userId:USER.id,title:'سکه اضافه شد 🎁',body:faN(pack.tokens)+' سکه به حساب شما اضافه شد.',type:'gift'});
  toast(faN(pack.tokens)+' سکه اضافه شد 🎁','gold');forceSyncNow();return true;
}
function startOnlinePayment(){
  if(!BUY)return;
  const mode=BUY.mode;
  if(mode==='sub'&&!BUY.planId){toast('یک اشتراک انتخاب کن','err');return}
  if(mode==='coins'&&totalTokens()<1){toast('حداقل یک بسته انتخاب کن','err');return}

  const btn=$('#payNow');
  if(btn){btn.disabled=true;btn.innerHTML='در حال باز کردن درگاه…'}

  // ابتدا تلاش برای استفاده از درگاه مایکت
  // اگه مایکت در دسترس نبود (مثلاً در WebView بدون bridge)،
  // خودکار به پرداخت دستی (کارت به کارت) میره
  showPaymentLoader('در حال اتصال به درگاه مایکت…');

  let attemptCount=0;
  const maxAttempts=2; // فقط ۲ بار تلاش کنه

  const doPurchase=function(){
    const isSub=(mode==='sub');
    const itemId=isSub?BUY.planId:buyItems()[0].id;
    const pid=iapProductIdFor(isSub?'sub':'coins',itemId);
    attemptCount++;
    updatePaymentLoader('در حال باز کردن درگاه پرداخت… (تلاش '+attemptCount+' از '+maxAttempts+')');

    MYKET.purchase(pid,isSub,function(res){
      if(!res||!res.success){
        logSilentError('myket_payment_failed',JSON.stringify(res&&res.error||res));

        const err=res&&res.error;
        // اگه bridge نبود یا timeout شد، مستقیم به پرداخت دستی بره
        if(err==='no_bridge'||err==='not_ready'||err==='timeout'||attemptCount>=maxAttempts){
          // نمایش مودال پرداخت دستی
          hidePaymentLoader();
          showManualPaymentModal();
          if(btn){btn.disabled=false;btn.innerHTML=icon('creditCard')+'پرداخت آنلاین'}
          return;
        }

        if(err==='cancelled'){
          hidePaymentLoader();
          if(btn){btn.disabled=false;btn.innerHTML=icon('creditCard')+'پرداخت آنلاین با مایکت'}
          return;
        }

        // تلاش مجدد
        setTimeout(function(){doPurchase()},1500);
        return;
      }

      // پرداخت مایکت موفق بود
      const purchase=res.purchase;
      if(!isSub){
        updatePaymentLoader('در حال تایید پرداخت…');
        MYKET.consume(purchase,function(consumed){
          if(consumed){deliverCoinsAfterMyketPayment(itemId)}
          else{
            logSilentError('myket_consume_failed','Consume ناموفق برای '+itemId);
            setTimeout(function(){
              MYKET.consume(purchase,function(ok2){
                if(ok2){deliverCoinsAfterMyketPayment(itemId)}
                else{
                  const pendings=DB.get('pendingMyketPurchases_'+USER.id,[]);
                  pendings.push({itemId:itemId,token:purchase.token,at:Date.now()});
                  DB.set('pendingMyketPurchases_'+USER.id,pendings);
                  logSilentError('myket_consume_pending','خرید ذخیره شد');
                  hidePaymentLoader();
                  if(btn){btn.disabled=false;btn.innerHTML=icon('creditCard')+'پرداخت آنلاین با مایکت'}
                }
              });
            },2000);
          }
        });
      }else{
        updatePaymentLoader('در حال فعال‌سازی اشتراک…');
        iapActivateAfterPayment('sub',BUY.planId);
        const plan=getCatalog().subs.find(function(s){return s.id===BUY.planId});
        BUY.done={text:'اشتراک «'+(plan?plan.name:'')+'» با موفقیت فعال شد.'};
        BUY.step=2;hidePaymentLoader();renderBuyPage();
      }
    });
  };

  // اگه bridge آماده نیست، مستقیم به پرداخت دستی بره (بدون تلاش اضافی)
  if(!MYKET.ready&&!MYKET.setupInProgress){
    MYKET.init(function(ok){
      if(!ok){
        // bridge پیدا نشد - مستقیم به پرداخت دستی
        hidePaymentLoader();
        showManualPaymentModal();
        if(btn){btn.disabled=false;btn.innerHTML=icon('creditCard')+'پرداخت آنلاین'}
        return;
      }
      doPurchase();
    });
  }else{
    doPurchase();
  }
}
